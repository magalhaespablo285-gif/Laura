<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Filters for soft depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients for characters and badges -->
    <linearGradient id="rainbow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="25%" stop-color="#FF9800" />
      <stop offset="50%" stop-color="#FFEB3B" />
      <stop offset="75%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F4F8" />
    </linearGradient>

    <!-- Letter gradients -->
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E02424" />
    </linearGradient>
    <linearGradient id="gradYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Background is 100% TRANSPARENT, NO white box -->

  <!-- Top Rainbow Arch & Clouds -->
  <g opacity="0.95" transform="translate(0, 10)">
    <!-- Arch stripes -->
    <path d="M 240 180 A 170 140 0 0 1 560 180" fill="none" stroke="#FF5252" stroke-width="12" stroke-linecap="round" />
    <path d="M 252 180 A 158 128 0 0 1 548 180" fill="none" stroke="#FFB74D" stroke-width="12" stroke-linecap="round" />
    <path d="M 264 180 A 146 116 0 0 1 536 180" fill="none" stroke="#FFEE58" stroke-width="12" stroke-linecap="round" />
    <path d="M 276 180 A 134 104 0 0 1 524 180" fill="none" stroke="#81C784" stroke-width="12" stroke-linecap="round" />
    <path d="M 288 180 A 122 92 0 0 1 512 180" fill="none" stroke="#4FC3F7" stroke-width="12" stroke-linecap="round" />
    <path d="M 300 180 A 110 80 0 0 1 500 180" fill="none" stroke="#BA68C8" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Stars and sparkles around -->
  <g fill="#F59E0B">
    <!-- Star Left -->
    <path d="M 210 130 L 214 140 L 225 142 L 216 150 L 219 161 L 210 155 L 201 161 L 204 150 L 195 142 L 206 140 Z" fill="#FBBF24" />
    <!-- Star Right -->
    <path d="M 590 120 L 594 131 L 606 133 L 597 141 L 600 152 L 590 146 L 580 152 L 583 141 L 574 133 L 586 131 Z" fill="#FBBF24" />
    <!-- Tiny Sparkles -->
    <circle cx="230" cy="90" r="4" fill="#EC4899" />
    <circle cx="560" cy="85" r="5" fill="#3B82F6" />
    <circle cx="180" cy="180" r="4" fill="#10B981" />
    <circle cx="620" cy="175" r="4.5" fill="#F97316" />
  </g>

  <!-- CHARACTERS (Girl & Boy) waving happily -->
  <g id="characters" filter="url(#shadow)">
    <!-- BOY (Right side of center) -->
    <g transform="translate(425, 55)">
      <!-- Boy Head -->
      <circle cx="45" cy="55" r="38" fill="#FEE2E2" />
      <!-- Boy Hair -->
      <path d="M 12 50 C 12 25 30 18 50 18 C 70 18 80 28 80 48 C 74 38 60 32 45 35 C 30 38 20 48 12 50 Z" fill="#6B4423" />
      <!-- Cap (Sporty backwards blue cap) -->
      <path d="M 10 42 C 12 20 32 12 55 12 C 75 12 85 24 85 42 Z" fill="#0284C7" />
      <path d="M 45 8 C 55 8 70 10 98 18 C 102 20 100 24 94 25 C 80 26 65 24 45 22 Z" fill="#0369A1" />
      <!-- Cap Button -->
      <circle cx="48" cy="10" r="4" fill="#38BDF8" />
      <!-- Eyes & Smile -->
      <ellipse cx="34" cy="52" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="36" cy="50" r="1.5" fill="#FFFFFF" />
      <ellipse cx="58" cy="52" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="60" cy="50" r="1.5" fill="#FFFFFF" />
      <!-- Rosy cheeks -->
      <ellipse cx="26" cy="60" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.6" />
      <ellipse cx="66" cy="60" rx="6" ry="3.5" fill="#FCA5A5" opacity="0.6" />
      <!-- Big open smile -->
      <path d="M 38 62 Q 46 75 54 62" fill="#E11D48" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
      <!-- Boy Shirt Collar -->
      <path d="M 22 90 C 25 80 35 78 45 78 C 55 78 68 80 72 90" fill="#16A34A" />
      <!-- Waving Hand -->
      <circle cx="85" cy="50" r="10" fill="#FEE2E2" />
      <path d="M 85 42 Q 95 35 90 28" stroke="#FEE2E2" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- GIRL (Left side of center) -->
    <g transform="translate(290, 55)">
      <!-- Girl Hair (pigtails) -->
      <circle cx="8" cy="55" r="18" fill="#B45309" />
      <circle cx="82" cy="55" r="18" fill="#B45309" />
      <!-- Girl Head -->
      <circle cx="45" cy="55" r="38" fill="#FEF2F2" />
      <!-- Bangs -->
      <path d="M 12 45 C 20 22 45 20 78 45 C 65 32 50 30 45 32 C 32 30 20 35 12 45 Z" fill="#B45309" />
      <!-- Big Cute Pink Hair Bow -->
      <path d="M 45 18 C 30 5 15 20 36 24 Z" fill="#EC4899" />
      <path d="M 45 18 C 60 5 75 20 54 24 Z" fill="#EC4899" />
      <circle cx="45" cy="19" r="6" fill="#F43F5E" />
      <!-- Eyes with eyelashes -->
      <ellipse cx="32" cy="52" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="34" cy="50" r="1.5" fill="#FFFFFF" />
      <path d="M 26 48 L 30 50" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="56" cy="52" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="58" cy="50" r="1.5" fill="#FFFFFF" />
      <path d="M 62 48 L 58 50" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
      <!-- Rosy Cheeks -->
      <ellipse cx="24" cy="60" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.7" />
      <ellipse cx="64" cy="60" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.7" />
      <!-- Sweet Smile -->
      <path d="M 36 62 Q 44 74 52 62" fill="#E11D48" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
      <!-- Dress Collar -->
      <path d="M 20 90 C 24 80 34 78 45 78 C 56 78 66 80 70 90" fill="#F43F5E" />
      <!-- Waving Hand -->
      <circle cx="5" cy="50" r="10" fill="#FEF2F2" />
      <path d="M 5 42 Q -5 35 0 28" stroke="#FEF2F2" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- MAIN BRAND TEXT: "LAURA" -->
  <!-- Designed with playful bouncy lettering, thick borders & 3D drop depth -->
  <g id="brand-laura" filter="url(#shadow)" transform="translate(0, 40)">
    
    <!-- LETTER L (Red) -->
    <g transform="translate(145, 185)">
      <!-- 3D Shadow -->
      <path d="M 12 110 L 12 12 L 48 12 L 48 76 L 95 76 L 95 110 Z" fill="#991B1B" transform="translate(4, 6)" />
      <!-- Main Letter -->
      <path d="M 12 110 L 12 12 L 48 12 L 48 76 L 95 76 L 95 110 Z" fill="url(#gradRed)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
      <!-- Highlight -->
      <path d="M 20 22 L 20 98 L 30 98 L 30 22 Z" fill="#FFFFFF" opacity="0.35" rx="5" />
    </g>

    <!-- LETTER A (Yellow) -->
    <g transform="translate(255, 175) rotate(-3)">
      <!-- 3D Shadow -->
      <path d="M 52 10 L 98 120 L 62 120 L 52 94 L 28 94 L 18 120 L -14 120 L 32 10 Z M 40 45 L 32 72 L 48 72 Z" fill="#B45309" transform="translate(4, 6)" />
      <!-- Main Letter -->
      <path d="M 52 10 L 98 120 L 62 120 L 52 94 L 28 94 L 18 120 L -14 120 L 32 10 Z M 40 45 L 32 72 L 48 72 Z" fill="url(#gradYellow)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
      <!-- Highlight -->
      <circle cx="40" cy="30" r="5" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- LETTER U (Sky Blue) -->
    <g transform="translate(372, 185)">
      <!-- 3D Shadow -->
      <path d="M 12 15 C 12 15 12 70 12 80 C 12 102 32 115 54 115 C 76 115 96 102 96 80 C 96 70 96 15 96 15 L 64 15 C 64 25 64 74 64 78 C 64 86 58 92 54 92 C 50 92 44 86 44 78 C 44 74 44 25 44 15 Z" fill="#0369A1" transform="translate(4, 6)" />
      <!-- Main Letter -->
      <path d="M 12 15 C 12 15 12 70 12 80 C 12 102 32 115 54 115 C 76 115 96 102 96 80 C 96 70 96 15 96 15 L 64 15 C 64 25 64 74 64 78 C 64 86 58 92 54 92 C 50 92 44 86 44 78 C 44 74 44 25 44 15 Z" fill="url(#gradBlue)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
      <!-- Highlight -->
      <path d="M 22 25 L 22 75 C 22 84 28 88 32 88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.35" />
    </g>

    <!-- LETTER R (Green) -->
    <g transform="translate(488, 182) rotate(2)">
      <!-- 3D Shadow -->
      <path d="M 14 112 L 14 14 L 62 14 C 84 14 96 26 96 46 C 96 62 85 72 68 76 L 98 112 L 64 112 L 44 80 L 44 112 Z M 44 38 L 44 58 L 60 58 C 67 58 72 54 72 48 C 72 42 67 38 60 38 Z" fill="#15803D" transform="translate(4, 6)" />
      <!-- Main Letter -->
      <path d="M 14 112 L 14 14 L 62 14 C 84 14 96 26 96 46 C 96 62 85 72 68 76 L 98 112 L 64 112 L 44 80 L 44 112 Z M 44 38 L 44 58 L 60 58 C 67 58 72 54 72 48 C 72 42 67 38 60 38 Z" fill="url(#gradGreen)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
      <!-- Highlight -->
      <path d="M 22 24 L 22 100" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35" />
    </g>

    <!-- LETTER A (Pink) -->
    <g transform="translate(605, 178) rotate(4)">
      <!-- 3D Shadow -->
      <path d="M 52 10 L 98 120 L 62 120 L 52 94 L 28 94 L 18 120 L -14 120 L 32 10 Z M 40 45 L 32 72 L 48 72 Z" fill="#9D174D" transform="translate(4, 6)" />
      <!-- Main Letter -->
      <path d="M 52 10 L 98 120 L 62 120 L 52 94 L 28 94 L 18 120 L -14 120 L 32 10 Z M 40 45 L 32 72 L 48 72 Z" fill="url(#gradPink)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
      <!-- Highlight -->
      <circle cx="40" cy="30" r="5" fill="#FFFFFF" opacity="0.6" />
    </g>
  </g>

  <!-- "KIDS" BADGE & LETTERS -->
  <g id="brand-kids" transform="translate(0, 345)" filter="url(#shadow)">
    <!-- Pill container -->
    <rect x="230" y="0" width="340" height="66" rx="33" fill="#FFFFFF" stroke="#FDE047" stroke-width="5" />
    <rect x="234" y="4" width="332" height="58" rx="29" fill="#FFFBEB" />

    <!-- Left Star Decor -->
    <path d="M 262 33 L 265 40 L 273 41 L 267 47 L 269 55 L 262 50 L 255 55 L 257 47 L 251 41 L 259 40 Z" fill="#F59E0B" />
    <!-- Right Heart Decor -->
    <path d="M 536 28 C 532 23 525 24 523 29 C 521 24 514 23 510 28 C 505 34 512 43 523 50 C 534 43 541 34 536 28 Z" fill="#EC4899" />

    <!-- K (Orange) -->
    <g transform="translate(290, 8)">
      <text x="0" y="40" font-family="'Outfit', 'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="44" fill="#EA580C">K</text>
    </g>

    <!-- I (Blue) -->
    <g transform="translate(352, 8)">
      <text x="0" y="40" font-family="'Outfit', 'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="44" fill="#0284C7">I</text>
      <circle cx="7" cy="4" r="5" fill="#38BDF8" />
    </g>

    <!-- D (Purple) -->
    <g transform="translate(398, 8)">
      <text x="0" y="40" font-family="'Outfit', 'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="44" fill="#7C3AED">D</text>
    </g>

    <!-- S (Green) -->
    <g transform="translate(460, 8)">
      <text x="0" y="40" font-family="'Outfit', 'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="44" fill="#16A34A">S</text>
    </g>
  </g>

  <!-- SUBTITLE: MODA INFANTIL -->
  <g transform="translate(400, 445)">
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" letter-spacing="7" fill="#64748B">
      MODA INFANTIL
    </text>
  </g>
</svg>